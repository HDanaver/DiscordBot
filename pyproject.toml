[project]
name = "discordbot"
version = "0.1.0"
description = "A Discord bot with music playback, role management, welcome messages, and Twitch stream alerts."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "discord.py[voice]>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "aiohttp>=3.9,<4.0",
    "yt-dlp>=2024.12",
    "spotipy>=2.24,<3.0",
]

[tool.uv]
upgrade = true